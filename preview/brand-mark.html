<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brand Mark — PercyCodes</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--pc-bg-app);font-family:var(--pc-font-sans);color:var(--pc-fg-1)}
.card{padding:18px 20px;display:flex;align-items:center;gap:24px;height:230px;box-sizing:border-box}
.markwrap{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  width:200px;height:200px}
.markwrap img{height:180px;width:auto;filter:var(--pc-drop-pink)}
.meta{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:.78rem;letter-spacing:.20em;font-weight:900;color:var(--pc-pink);
  text-shadow:0 0 10px rgba(255,78,201,.5);text-transform:uppercase}
.name{font-size:1.6rem;font-weight:900;letter-spacing:.02em;color:#fff;line-height:1.05}
.tag{font-size:.92rem;color:var(--pc-fg-2);line-height:1.5;max-width:380px}
.swatch-row{display:flex;gap:8px;margin-top:6px}
.sw{width:22px;height:22px;border-radius:6px;border:1px solid rgba(255,255,255,.15)}
</style>
</head>
<body>
<div class="card">
  <div class="markwrap"><img src="../assets/percycodes-mark.png" alt="PercyCodes mark"></div>
  <div class="meta">
    <div class="eyebrow">Brand Mark</div>
    <div class="name">PercyCodes</div>
    <div class="tag">Sticker-style 3D mark — chunky pink <strong style="color:#fff">P</strong>, comic <strong style="color:var(--pc-mark-yellow)">&lt;/&gt;</strong>, halftone burst, lightning bolts. Treat as a single PNG; never re-implement in CSS.</div>
    <div class="swatch-row">
      <div class="sw" style="background:#e9258a"></div>
      <div class="sw" style="background:#ffd23f"></div>
      <div class="sw" style="background:#52d8ff"></div>
      <div class="sw" style="background:#fff"></div>
      <div class="sw" style="background:#0a0a0a"></div>
    </div>
  </div>
</div>
</body>
</html>
