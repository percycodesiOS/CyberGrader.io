<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Accent Colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--pc-bg-app);font-family:var(--pc-font-sans);color:var(--pc-fg-1)}
.card{padding:18px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;box-sizing:border-box}
.s{border-radius:12px;padding:10px;height:120px;display:flex;flex-direction:column;justify-content:space-between;
  border:1px solid rgba(255,255,255,.08);position:relative;overflow:hidden}
.s::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 0%,rgba(255,255,255,.18),transparent 60%);pointer-events:none}
.name{font-weight:900;font-size:.78rem;letter-spacing:.04em}
.hex{font-size:.7rem;font-variant-numeric:tabular-nums;opacity:.85}
.role{font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;opacity:.85;font-weight:800}
.dark{color:#02131f}
.light{color:#02131f}
</style>
</head>
<body>
<div class="card">
  <div class="s dark" style="background:#51d9ff"><div><div class="name">--pc-cyan</div><div class="role">primary</div></div><div class="hex">#51D9FF</div></div>
  <div class="s dark" style="background:#00b7ff"><div><div class="name">--pc-cyan-2</div><div class="role">deeper</div></div><div class="hex">#00B7FF</div></div>
  <div class="s" style="background:#ff4ec9;color:#240414"><div><div class="name">--pc-pink</div><div class="role">SENIORS</div></div><div class="hex">#FF4EC9</div></div>
  <div class="s dark" style="background:#7dffb5"><div><div class="name">--pc-green</div><div class="role">grades 7–11</div></div><div class="hex">#7DFFB5</div></div>
  <div class="s" style="background:#ff7d7d;color:#270e0e"><div><div class="name">--pc-red</div><div class="role">danger</div></div><div class="hex">#FF7D7D</div></div>
  <div class="s" style="background:#ff9f43;color:#2a1700"><div><div class="name">--pc-orange</div><div class="role">edit-mode</div></div><div class="hex">#FF9F43</div></div>
</div>
</body>
</html>
