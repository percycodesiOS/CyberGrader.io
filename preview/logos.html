<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logo Lockups</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--pc-bg-app);font-family:var(--pc-font-sans);color:var(--pc-fg-1)}
.card{padding:20px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;height:260px;box-sizing:border-box}
.lock{display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,rgba(50,54,66,.95),rgba(45,49,60,.95));
  border:1px solid var(--pc-border);border-radius:14px;padding:16px}
.lock img{max-width:100%;max-height:120px;width:auto;filter:var(--pc-drop-cyan)}
.lock.pink img{filter:var(--pc-drop-pink)}
.lbl{font-size:.72rem;letter-spacing:.18em;font-weight:900;color:var(--pc-cyan);
  text-transform:uppercase;text-shadow:0 0 8px rgba(81,217,255,.5);margin-top:10px}
.lock.pink .lbl{color:var(--pc-pink);text-shadow:0 0 8px rgba(255,78,201,.5)}
</style>
</head>
<body>
<div class="card">
  <div class="lock"><img src="../assets/cybergrader-logo.png" alt=""><div class="lbl">CyberGrader.io</div></div>
  <div class="lock pink"><img src="../assets/percy-logo.png" alt=""><div class="lbl">Percy (footer)</div></div>
  <div class="lock"><img src="../assets/sv-portal-logo.png" alt=""><div class="lbl">Gradebook Setup</div></div>
</div>
</body>
</html>
