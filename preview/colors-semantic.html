<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Semantic Color Pairs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--pc-bg-app);font-family:var(--pc-font-sans);color:var(--pc-fg-1)}
.card{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px;box-sizing:border-box}
.cell{padding:14px;border-radius:14px;display:flex;flex-direction:column;gap:8px}
.cell.s{background:rgba(255,110,180,.10);border:1px solid rgba(255,110,180,.38)}
.cell.g{background:rgba(125,255,181,.10);border:1px solid rgba(125,255,181,.38)}
.eyebrow{font-size:.7rem;letter-spacing:.20em;font-weight:900;text-transform:uppercase}
.cell.s .eyebrow{color:var(--pc-pink);text-shadow:0 0 10px rgba(255,78,201,.5)}
.cell.g .eyebrow{color:var(--pc-green);text-shadow:0 0 10px rgba(125,255,181,.4)}
.title{font-size:1rem;font-weight:900;color:#fff}
.body{font-size:.82rem;color:var(--pc-fg-2);line-height:1.45}
.token{font-family:ui-monospace,Menlo,Monaco,monospace;font-size:.72rem;color:var(--pc-fg-2)}
.cell.s .token{color:#ffb0e0}
.cell.g .token{color:#b6f5d5}
</style>
</head>
<body>
<div class="card">
  <div class="cell s">
    <div class="eyebrow">⬡ Senior</div>
    <div class="title">4th-9-weeks Seniors</div>
    <div class="body">Pink means seniors. Anywhere. The "NO EXTENSIONS FOR SENIORS" callout uses this exact treatment.</div>
    <div class="token">--pc-pink · #FF4EC9</div>
  </div>
  <div class="cell g">
    <div class="eyebrow">◆ General</div>
    <div class="title">Grades 7–11</div>
    <div class="body">Cyan-green pairs with senior pink. Reused for "save" / success states across the app.</div>
    <div class="token">--pc-green · #7DFFB5</div>
  </div>
</div>
</body>
</html>
