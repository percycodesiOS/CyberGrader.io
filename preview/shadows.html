<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shadows & Glow</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--pc-bg-app);font-family:var(--pc-font-sans);color:var(--pc-fg-1)}
.card{padding:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;box-sizing:border-box}
.tile{height:140px;border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;
  background:var(--pc-bg-panel);border:1px solid var(--pc-border)}
.tile.panel{box-shadow:var(--pc-shadow-panel)}
.tile.btn{box-shadow:var(--pc-shadow-button);background:var(--pc-bg-button);color:#02131f;border-color:rgba(81,217,255,.6)}
.tile.glow{justify-content:center;align-items:center;text-align:center}
.tile.glow .label{font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:1.2rem;color:#fff;text-shadow:var(--pc-glow-cyan)}
.tok{font-family:ui-monospace,Menlo,monospace;font-size:.7rem;color:var(--pc-cyan);font-weight:700}
.tile.btn .tok{color:#02131f}
.lbl{font-size:.78rem;font-weight:800;color:#fff}
.tile.btn .lbl{color:#02131f}
</style>
</head>
<body>
<div class="card">
  <div class="tile panel"><div class="lbl">Panel shadow</div><div class="tok">0 18 48 / .38</div></div>
  <div class="tile btn"><div class="lbl">Primary button</div><div class="tok">cyan glow + inset</div></div>
  <div class="tile glow"><div class="label">GLOW TEXT</div></div>
</div>
</body>
</html>
