<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--pc-bg-app);font-family:var(--pc-font-sans);color:var(--pc-fg-1)}
.card{padding:18px 20px;display:grid;grid-template-columns:repeat(8,1fr);gap:8px;box-sizing:border-box;align-content:center}
.cell{aspect-ratio:1;border-radius:12px;border:1px solid var(--pc-border);background:var(--pc-bg-card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px}
.glyph{font-size:1.4rem;line-height:1}
.lbl{font-size:.62rem;color:var(--pc-fg-2);letter-spacing:.04em;text-align:center;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <div class="cell"><span class="glyph">📝</span><span class="lbl">feedback</span></div>
  <div class="cell"><span class="glyph">✉️</span><span class="lbl">email</span></div>
  <div class="cell"><span class="glyph">⚙️</span><span class="lbl">portal</span></div>
  <div class="cell"><span class="glyph">📋</span><span class="lbl">checklist</span></div>
  <div class="cell"><span class="glyph" style="color:#ff7d7d">⚠</span><span class="lbl">warn</span></div>
  <div class="cell"><span class="glyph" style="color:var(--pc-pink)">⬡</span><span class="lbl">senior</span></div>
  <div class="cell"><span class="glyph" style="color:var(--pc-green)">◆</span><span class="lbl">general</span></div>
  <div class="cell"><span class="glyph">✏️</span><span class="lbl">edit</span></div>
  <div class="cell"><span class="glyph">🔀</span><span class="lbl">variation</span></div>
  <div class="cell"><span class="glyph" style="color:#ffe066">💡</span><span class="lbl">tip</span></div>
  <div class="cell"><span class="glyph" style="color:var(--pc-cyan)">ⓘ</span><span class="lbl">how-to</span></div>
  <div class="cell"><span class="glyph">🐾</span><span class="lbl">Percy</span></div>
  <div class="cell"><span class="glyph" style="color:var(--pc-fg-2)">▾</span><span class="lbl">menu</span></div>
  <div class="cell"><span class="glyph" style="color:var(--pc-fg-2)">✕</span><span class="lbl">close</span></div>
  <div class="cell"><span class="glyph" style="font-family:ui-monospace,Menlo,monospace;color:var(--pc-cyan)">&lt;/&gt;</span><span class="lbl">code</span></div>
  <div class="cell"><span class="glyph">📅</span><span class="lbl">date</span></div>
</div>
</body>
</html>
