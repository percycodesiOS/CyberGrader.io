<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Date Pill + User Chip</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--pc-bg-app);font-family:var(--pc-font-sans);color:var(--pc-fg-1)}
.card{padding:24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;box-sizing:border-box}
.date-pill{padding:12px 20px;border-radius:14px;border:1px solid rgba(81,217,255,.38);
  background:linear-gradient(180deg,rgba(58,62,76,.95),rgba(50,54,66,.92));display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.2}
.date-label{font-size:.78rem;letter-spacing:.20em;font-weight:900;color:var(--pc-cyan);text-shadow:0 0 10px rgba(81,217,255,.75),0 0 20px rgba(81,217,255,.4)}
.date-value{font-weight:800;font-size:1.05rem}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;
  border:1px solid rgba(81,217,255,.35);background:linear-gradient(180deg,rgba(0,183,255,.14),rgba(81,217,255,.08));font-weight:700}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--pc-cyan),var(--pc-cyan-2));color:#02131f;
  display:flex;align-items:center;justify-content:center;font-weight:900}
.howto{padding:10px 14px;border-radius:12px;border:1px solid rgba(81,217,255,.35);background:linear-gradient(180deg,rgba(0,183,255,.14),rgba(81,217,255,.06));color:#fff;font-weight:900;font-size:1.2rem}
</style>
</head>
<body>
<div class="card">
  <div class="date-pill"><span class="date-label">TODAY'S DATE</span><span class="date-value">Friday, May 8</span></div>
  <button class="user-chip"><span class="avatar">T</span><span>Teacher</span><span style="opacity:.55">▾</span></button>
  <button class="howto">ⓘ</button>
</div>
</body>
</html>
