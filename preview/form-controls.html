<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Form Controls</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--pc-bg-app);font-family:var(--pc-font-sans);color:var(--pc-fg-1)}
.card{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px;box-sizing:border-box}
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:.84rem;color:var(--pc-fg-2);font-weight:800;letter-spacing:.02em}
input,select,textarea{width:100%;border:1px solid rgba(81,217,255,.28);background:linear-gradient(180deg,#232730,#1e222a);color:#edf6ff;
  border-radius:14px;padding:13px 14px;font:inherit;box-sizing:border-box}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2351d9ff'><path d='M7 10l5 5 5-5z'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:38px}
textarea{min-height:84px;resize:none;border-color:rgba(255,159,67,.4);box-shadow:0 0 0 3px rgba(255,159,67,.07)}
.full{grid-column:1/-1}
</style>
</head>
<body>
<div class="card">
  <div class="field"><label for="a">Work Type</label><select id="a"><option>FIRST ASSIGNMENT</option><option>ASSIGNMENT</option></select></div>
  <div class="field"><label for="b">Output Type</label><select id="b"><option>Welcome First Nine Weeks</option></select></div>
  <div class="field full"><label for="c">Student Name</label><input id="c" type="text" placeholder="For single-student emails"></div>
  <div class="field full"><label for="d">Generated Output (editing)</label><textarea id="d">Graded 5/8/2026 - Welcome to the class…</textarea></div>
</div>
</body>
</html>
