<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Block Selector</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--pc-bg-app);font-family:var(--pc-font-sans);color:var(--pc-fg-1)}
.card{padding:20px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.b{border:1px solid rgba(81,217,255,.38);padding:18px 14px;border-radius:16px;
  background:linear-gradient(180deg,rgba(58,62,76,.95),rgba(50,54,66,.95));color:var(--pc-fg-1);
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.b.active{background:linear-gradient(180deg,rgba(0,183,255,.30),rgba(81,217,255,.14));
  border-color:rgba(81,217,255,.6);box-shadow:0 0 22px rgba(0,183,255,.22),inset 0 0 0 1px rgba(81,217,255,.18)}
.b .icon{font-size:1.6rem;line-height:1}
.b img{height:36px;width:auto}
.b .title{font-weight:900;font-size:.95rem;color:#fff}
.b .desc{font-size:.74rem;color:var(--pc-fg-3);line-height:1.3}
</style>
</head>
<body>
<div class="card">
  <div class="grid">
    <div class="b active"><span class="icon">📝</span><span class="title">Teacher Feedback</span><span class="desc">Student feedback for the gradebook</span></div>
    <div class="b"><span class="icon">✉️</span><span class="title">Email Generator</span><span class="desc">Recurring student emails</span></div>
    <div class="b"><span class="icon"><img src="../assets/sv-portal-logo.png" alt=""></span><span class="title">Gradebook Setup</span><span class="desc">Placeholder text + checklist</span></div>
  </div>
</div>
</body>
</html>
