<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--pc-bg-app);font-family:var(--pc-font-sans);color:var(--pc-fg-1)}
.card{padding:20px;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;box-sizing:border-box}
.shape{height:80px;background:var(--pc-bg-card);border:1px solid var(--pc-border-strong)}
.tok{font-family:ui-monospace,Menlo,monospace;font-size:.7rem;color:var(--pc-cyan);font-weight:700;text-align:center;margin-top:6px}
.size{font-size:.65rem;color:var(--pc-fg-2);text-align:center;font-variant-numeric:tabular-nums}
.cell{display:flex;flex-direction:column;gap:2px}
</style>
</head>
<body>
<div class="card">
  <div class="cell"><div class="shape" style="border-radius:9px"></div><div class="tok">--pc-r-sm</div><div class="size">9 px</div></div>
  <div class="cell"><div class="shape" style="border-radius:12px"></div><div class="tok">--pc-r-md</div><div class="size">12 px</div></div>
  <div class="cell"><div class="shape" style="border-radius:14px"></div><div class="tok">--pc-r-lg</div><div class="size">14 px · btn</div></div>
  <div class="cell"><div class="shape" style="border-radius:16px"></div><div class="tok">--pc-r-xl</div><div class="size">16 px · card</div></div>
  <div class="cell"><div class="shape" style="border-radius:18px"></div><div class="tok">--pc-r-2xl</div><div class="size">18 px · panel</div></div>
  <div class="cell"><div class="shape" style="border-radius:22px"></div><div class="tok">--pc-r-3xl</div><div class="size">22 px · topbar</div></div>
  <div class="cell"><div class="shape" style="border-radius:999px;height:48px;margin-bottom:32px"></div><div class="tok">--pc-r-pill</div><div class="size">999 · chip</div></div>
</div>
</body>
</html>
