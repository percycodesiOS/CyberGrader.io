<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Type — Display + Hierarchy</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--pc-bg-app);font-family:var(--pc-font-sans);color:var(--pc-fg-1)}
.card{padding:22px 26px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.brand{font-size:3.2rem;font-weight:900;letter-spacing:.02em;line-height:1}
.brand .dot{color:var(--pc-cyan)}
.panel-title{font-size:1.2rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#fff;
  text-shadow:var(--pc-glow-cyan);margin-top:4px}
.body{font-size:.95rem;color:var(--pc-fg-2);max-width:560px;line-height:1.5}
.row{display:flex;gap:14px;align-items:baseline;color:var(--pc-fg-2);font-size:.78rem}
.row code{color:var(--pc-cyan);font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<div class="card">
  <div class="brand">CyberGrader<span class="dot">.io</span></div>
  <div class="panel-title">Teacher Notes</div>
  <div class="body">"Pick the type. Copy. Paste into the gradebook. Done." Body copy is plain Segoe UI, weight 600, line-height 1.5–1.6.</div>
  <div class="row"><code>--pc-fs-display</code> clamp(2.5–4.2rem) · <code>--pc-fw-black</code> 900 · <code>--pc-tracking-wider</code> .06em</div>
</div>
</body>
</html>
