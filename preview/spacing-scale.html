<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spacing Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--pc-bg-app);font-family:var(--pc-font-sans);color:var(--pc-fg-1)}
.card{padding:20px;display:grid;grid-template-columns:auto 1fr auto;gap:10px 16px;align-items:center;box-sizing:border-box}
.tok{font-family:ui-monospace,Menlo,monospace;font-size:.74rem;color:var(--pc-cyan);font-weight:700}
.bar{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--pc-cyan-2),var(--pc-cyan));
  box-shadow:0 0 12px rgba(81,217,255,.35)}
.size{font-size:.72rem;color:var(--pc-fg-2);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="card">
  <div class="tok">--pc-s-1</div><div><div class="bar" style="width:4px"></div></div><div class="size">4 px</div>
  <div class="tok">--pc-s-2</div><div><div class="bar" style="width:8px"></div></div><div class="size">8 px</div>
  <div class="tok">--pc-s-3</div><div><div class="bar" style="width:12px"></div></div><div class="size">12 px</div>
  <div class="tok">--pc-s-4</div><div><div class="bar" style="width:16px"></div></div><div class="size">16 px · panel gap</div>
  <div class="tok">--pc-s-5</div><div><div class="bar" style="width:20px"></div></div><div class="size">20 px · panel pad</div>
  <div class="tok">--pc-s-6</div><div><div class="bar" style="width:26px"></div></div><div class="size">26 px · topbar pad</div>
  <div class="tok">--pc-s-7</div><div><div class="bar" style="width:32px"></div></div><div class="size">32 px · modal pad</div>
</div>
</body>
</html>
