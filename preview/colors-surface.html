<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Surface Colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--pc-bg-app);font-family:var(--pc-font-sans);color:var(--pc-fg-1)}
.card{padding:18px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;box-sizing:border-box}
.s{border-radius:12px;padding:10px;height:100px;display:flex;flex-direction:column;justify-content:space-between;
  border:1px solid rgba(255,255,255,.06)}
.name{font-weight:900;font-size:.78rem;letter-spacing:.04em;color:#fff}
.hex{font-size:.7rem;color:var(--pc-fg-2);font-variant-numeric:tabular-nums}
.role{font-size:.65rem;color:var(--pc-fg-2);text-transform:uppercase;letter-spacing:.12em}
</style>
</head>
<body>
<div class="card">
  <div class="s" style="background:#23262e"><div><div class="name">--pc-bg</div><div class="role">app top</div></div><div class="hex">#23262E</div></div>
  <div class="s" style="background:#1e2128"><div><div class="name">--pc-bg-2</div><div class="role">app bottom</div></div><div class="hex">#1E2128</div></div>
  <div class="s" style="background:#2d313c"><div><div class="name">--pc-panel</div><div class="role">panel base</div></div><div class="hex">#2D313C</div></div>
  <div class="s" style="background:#323642"><div><div class="name">--pc-panel-2</div><div class="role">panel raised</div></div><div class="hex">#323642</div></div>
  <div class="s" style="background:#2a2e39"><div><div class="name">--pc-panel-3</div><div class="role">panel deep</div></div><div class="hex">#2A2E39</div></div>
</div>
</body>
</html>
