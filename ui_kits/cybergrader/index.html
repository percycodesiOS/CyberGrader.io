<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CyberGrader.io · UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="controls.jsx"></script>
<script type="text/babel" src="Topbar.jsx"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="BlockSelector.jsx"></script>
<script type="text/babel" src="FeedbackBlock.jsx"></script>
<script type="text/babel" src="EmailBlock.jsx"></script>
<script type="text/babel" src="PortalBlock.jsx"></script>
<script type="text/babel" src="Modals.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>

<script type="text/babel">
const { useState } = React;

const DEFAULT_GRADE_OUTPUT = (d) =>
  `Graded ${d} - Welcome to the class, I reviewed your first assignment and you are starting strong, your work was clear and showed real effort, keep this energy going because it is a great way to kick off the school year, as always, I'm here if you have any questions.`;

const App = () => {
  const today = new Date();
  const longDate = today.toLocaleDateString("en-US", {
    weekday: "long", year: "numeric", month: "long", day: "numeric",
  });
  const shortDate = today.toLocaleDateString("en-US");

  const [block, setBlock] = useState("feedback");
  const [workType, setWorkType] = useState("FIRST ASSIGNMENT");
  const [outputType, setOutputType] = useState("Welcome First Nine Weeks");
  const [editing, setEditing] = useState(false);
  const [output, setOutput] = useState(DEFAULT_GRADE_OUTPUT(shortDate));
  const [copied, setCopied] = useState(false);

  const [term, setTerm] = useState("first");
  const [audience, setAudience] = useState("All Students");
  const [portalType, setPortalType] = useState("weekly");

  const [howToOpen, setHowToOpen] = useState(false);
  const [syOpen, setSyOpen] = useState(false);

  const handleCopy = () => {
    if (output) {
      navigator.clipboard?.writeText(output).catch(() => {});
      setCopied(true);
      setTimeout(() => setCopied(false), 1400);
    }
  };

  return (
    <div className="cg-app">
      <Topbar dateValue={longDate} userName="Teacher" />
      <main className="cg-main-grid">
        <Sidebar schoolYear={{}} onEditDates={() => setSyOpen(true)} />
        <section className="cg-panel">
          <div className="cg-panel__inner">
            <h2 className="cg-panel-title" style={{marginBottom: 18}}>Choose Your Workflow</h2>
            <div className="cg-info-callout" style={{textAlign:'center',fontWeight:700,color:'var(--text)'}}>
              Choose a block below to select pre-generated feedback or emails. Once you pick a block, narrow down the type you're looking for.
            </div>
            <BlockSelector value={block} onChange={setBlock} />
            {block === "feedback" && (
              <FeedbackBlock
                workType={workType} setWorkType={setWorkType}
                outputType={outputType} setOutputType={setOutputType}
                output={output} setOutput={setOutput}
                editing={editing} setEditing={setEditing}
                onCopy={handleCopy} copied={copied}
              />
            )}
            {block === "email" && (
              <EmailBlock term={term} setTerm={setTerm}
                audience={audience} setAudience={setAudience} />
            )}
            {block === "portal" && (
              <PortalBlock portalType={portalType} setPortalType={setPortalType} />
            )}
          </div>
        </section>
      </main>
      <div className="cg-divider" />
      <Footer />

      <SchoolYearModal open={syOpen} onClose={() => setSyOpen(false)} onSave={() => setSyOpen(false)} />
      <HowToModal open={howToOpen} onClose={() => setHowToOpen(false)} />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
