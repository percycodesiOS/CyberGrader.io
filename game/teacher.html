<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1a2e">
<meta name="robots" content="noindex">
<title>MYnecraft: Multiplayer coming soon</title>
<link rel="icon" type="image/svg+xml" href="assets/mynecraft-icon.svg">
<style>
/* Reached only from the hidden teacher entrance (Mr. Macek on the title screen).
   The real group-room page and service stay in the repo, unlinked and off. */
@font-face{font-family:Bungee;src:url('assets/bungee/Bungee-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:Fredoka;src:url('assets/fredoka/Fredoka-latin.woff2') format('woff2');font-weight:300 700;font-display:swap}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(180deg,rgba(11,26,46,.55),rgba(11,26,46,.92)),url('assets/ec-title-bg.jpg') center/cover no-repeat,#0b1a2e;color:#f4f1e8;font:500 18px/1.5 Fredoka,"Segoe UI",system-ui,sans-serif;text-align:center}
main{width:min(560px,100%);padding:clamp(22px,4vw,36px);border:1px solid rgba(244,241,232,.18);border-radius:24px;background:rgba(11,26,46,.88);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.blocks{font-size:44px;line-height:1;margin-bottom:8px}
h1{margin:0;font:400 clamp(28px,6vw,42px)/1.1 Bungee,Impact,sans-serif;color:#ffd27a;text-shadow:0 4px 0 #071121}
.joke{margin:14px 0 0;font:600 clamp(20px,3.6vw,26px)/1.3 Fredoka,system-ui,sans-serif}
.back{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:26px;min-height:64px;padding:12px 30px;border-radius:999px;text-decoration:none;background:linear-gradient(180deg,#ffd27a,#f2b544);color:#1a1405;font:400 22px Bungee,Impact,sans-serif;letter-spacing:.06em;box-shadow:0 8px 0 #9a6a12}
.back:hover{color:#1a1405;filter:brightness(1.05)}
.back:active{transform:translateY(5px);box-shadow:0 3px 0 #9a6a12}
.back:focus-visible{outline:3px solid #fff;outline-offset:4px}
.note{margin:24px 0 0;color:#b9c4d4;font-size:14px}
</style>
</head>
<body>
<main>
  <div class="blocks" aria-hidden="true">🧱🧱🧱</div>
  <h1>Multiplayer: coming soon…</h1>
  <p class="joke">…before you graduate. Probably. 😂</p>
  <a class="back" href="mynecraft.html">▶ Back to the game</a>
  <p class="note">For teachers: class rooms need a room server that isn’t set up yet.</p>
</main>
</body>
</html>
